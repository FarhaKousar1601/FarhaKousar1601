<svg width="1600" height="440" viewBox="0 0 1600 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#021b1b"/>
      <stop offset="100%" stop-color="#041a1a"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#0c4f4f" stroke-opacity="0.2"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="440" fill="url(#bgGrad)"/>
  <rect width="1600" height="440" fill="url(#grid)"/>

  <rect x="26" y="18" width="1548" height="404" rx="18" fill="rgba(1,26,27,0.82)" stroke="#0d7a7a" stroke-width="2.2"/>

