<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1350" width="100%" height="100%" role="img" aria-label="Farha Kousar - Dynamic Flow Hacker Terminal Portfolio Banner">
  <title>Farha Kousar — Hacker Terminal Portfolio</title>

  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;family=Space+Grotesk:wght@700;800&amp;display=swap');

      .fk-bg { fill: #020605; }
      .fk-mono { font-family: 'Fira Code', 'JetBrains Mono', monospace; }
      .fk-head { font-family: 'Space Grotesk', sans-serif; font-weight: 800; }

      .text-green { fill: #00ffaa; }
      .text-dim { fill: #4e7c6d; }
      .text-light { fill: #d0f4ea; }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes flowWave1 {
        0% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-15px) scale(1.02); }
        100% { transform: translateY(0px) scale(1); }
      }
      @keyframes flowWave2 {
        0% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(20px) scale(0.98); }
        100% { transform: translateY(0px) scale(1); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.55; }
      }

      .anim-blink { animation: blink 0.9s step-start infinite; }
      .anim-flow-1 { animation: flowWave1 12s ease-in-out infinite; transform-origin: center; }
      .anim-flow-2 { animation: flowWave2 16s ease-in-out infinite; transform-origin: center; }
      .anim-pulse { animation: pulseGlow 6s ease-in-out infinite; }
    </style>

    <!-- Dynamic Flow Gradients -->
    <linearGradient id="flow-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffaa" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#008855" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#002b1f" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="flow-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00b87c" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#00ffaa" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#011610" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffaa" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00b87c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffaa" />
      <stop offset="50%" stop-color="#00b87c" />
      <stop offset="100%" stop-color="#030706" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="ambient-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00ffaa" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#005533" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#020605" stop-opacity="0.0" />
    </radialGradient>
  </defs>

